version: '3.8'

services:
  text2sql-rag:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PYTHONPATH=/app/src
      - LOG_LEVEL=INFO
      - WEB_HOST=0.0.0.0
      - WEB_PORT=5000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./logs:/app/logs
      - ./configs:/app/configs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Add a reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - text2sql-rag
    restart: unless-stopped
    profiles:
      - production

networks:
  default:
    name: text2sql-network


